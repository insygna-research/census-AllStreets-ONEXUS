  One process. Local-first. Five-component kernel. Every tool call gated by Aegis. Every event logged to Chronicle. The kernel never touches the network — there's a static test that proves it. ONEXUS runs agents the way iOS runs apps. Built-in cognitive modules (Council, Specter, Wraith, Echo, Oracle, Legacy, Consciousness, Sentry, Autonomic, Agents-dispatcher) and 7,000+ third-party agents from ONEXUS-Agents — 500+ with MCP adapters — share one runtime, one manifest, one trust model, one set of surfaces. A workspace is a room: it owns its own agents, memory, file grants, and home tone. Every tool call routes through a capability arbiter that gates against the agent's declared permissions, surfaces a first-use prompt when something needs your approval, and writes every byte to an immutable audit ledger. Primary language: python; ships a container definition; observed outbound integrations: api.openai.com, api.anthropic.com, self-hosted inference.
